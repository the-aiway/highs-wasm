name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Required by the `main` ruleset (the-aiway/infra, github/rulesets.ts): keep the
  # job name stable. The WASM build needs emscripten and the HiGHS submodule, so it
  # is not run here; the tests and the JS build use the committed `dist`.
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun test src/
      - run: ./build.ts
